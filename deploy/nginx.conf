# WeOnline — reverse proxy with TLS termination (nginx).
#
# The app runs on plain HTTP bound to localhost (HOST=127.0.0.1, the default); nginx
# terminates TLS and forwards to it. Obtain certs with certbot/Let's Encrypt.
#
# Run the app with:  AUTH_SECRET=... TRUST_PROXY=1 NODE_ENV=production npm start

# Redirect all HTTP to HTTPS.
server {
    listen 80;
    server_name weonline.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name weonline.example.com;

    ssl_certificate     /etc/letsencrypt/live/weonline.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/weonline.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Match the app's 100kb JSON body cap (plus margin).
    client_max_body_size 256k;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Pass through WebSocket upgrades (harmless in prod; used by Vite in dev).
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
